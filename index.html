<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Workspace นักเขียน & นักวาด (Cloud Sync)</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
<!-- โหลด Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<style>
:root {
  --bg: #f8f9fa; --panel: #ffffff; --text: #2d3436; --muted: #636e72; --border: #dfe6e9;
  --accent: #0984e3; --accent-hover: #74b9ff; --danger: #d63031; --done: #00b894; --draft: #f39c12;
  --shadow: 0 4px 12px rgba(0,0,0,0.05);
  --radius: 12px;
  box-sizing: border-box;
}
* { box-sizing: border-box; }
body { margin: 0; font-family: 'Sarabun', sans-serif; background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; }
h1, h2, h3, h4 { margin: 0 0 10px; color: #2d3436; }
h1 { font-size: 24px; font-weight: 700; }

/* Layout */
.app { display: flex; height: 100vh; position: relative; z-index: 1; }
.sidebar { width: 280px; flex-shrink: 0; background: var(--panel); border-right: 1px solid var(--border); padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; }
.main { flex: 1; padding: 30px 40px; overflow-y: auto; background: var(--bg); scroll-behavior: auto; }
.container { max-width: 1000px; margin: 0 auto; }

/* Buttons & Inputs */
button { font-family: inherit; cursor: pointer; border: none; border-radius: 8px; padding: 10px 16px; background: var(--accent); color: #fff; font-weight: 600; transition: all 0.2s; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
button:hover { background: var(--accent-hover); transform: translateY(-1px); }
button.ghost { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
button.ghost:hover { background: rgba(9, 132, 227, 0.1); }
button.danger { background: transparent; color: var(--danger); border: 1px solid var(--danger); }
button.danger:hover { background: rgba(214, 48, 49, 0.1); }
button.small { padding: 6px 12px; font-size: 13px; }

button.btn-close {
  background: transparent; color: var(--muted); border: none; font-size: 16px; padding: 0; border-radius: 6px;
  display: flex; align-items: center; justify-content: center; width: 28px; height: 28px; flex-shrink: 0;
  transition: all 0.2s ease; margin: 0;
}
button.btn-close:hover { background: #fee2e2; color: #dc2626; transform: none; }

input, textarea, select { font-family: inherit; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; font-size: 14px; width: 100%; transition: border 0.2s; color: var(--text); }
input:focus, textarea:focus, select:focus { border-color: var(--accent); outline: none; }
textarea { resize: vertical; min-height: 80px; }

/* Components */
.card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 16px; box-shadow: var(--shadow); }
.row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.row.nowrap { flex-wrap: nowrap; align-items: center; }
.col { display: flex; flex-direction: column; gap: 8px; flex: 1; min-width: 0; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

/* Tabs */
.tabs { display: flex; gap: 4px; border-bottom: 2px solid var(--border); margin-bottom: 24px; overflow-x: auto; padding-bottom: 2px; }
.tab { padding: 10px 20px; cursor: pointer; color: var(--muted); font-weight: 600; border-bottom: 3px solid transparent; margin-bottom: -2px; white-space: nowrap; transition: all 0.2s; }
.tab:hover { color: var(--accent); }
.tab.active { color: var(--accent); border-color: var(--accent); }

/* Badges & Chips */
.badge { display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; color: #fff; }
.badge.writing { background: #0984e3; } .badge.done { background: var(--done); } .badge.paused { background: var(--muted); }
.badge.draft { background: var(--draft); } .badge.final { background: var(--done); }
.chip { background: var(--border); padding: 4px 12px; border-radius: 20px; font-size: 12px; display: inline-flex; align-items: center; gap: 6px; color: var(--text); transition: background 0.2s; }
.chip button { background: none; color: var(--muted); padding: 0; font-size: 14px; line-height: 1; border: none; min-width: auto; cursor: pointer; }
.chip button:hover { color: var(--danger); transform: none; }

/* Novel List */
.novel-item { padding: 12px 16px; border-radius: 8px; cursor: pointer; border: 1px solid transparent; transition: all 0.2s; background: var(--bg); }
.novel-item:hover { border-color: var(--border); background: #fdfdfd; }
.novel-item.active { background: var(--accent); color: #fff; box-shadow: 0 4px 10px rgba(9,132,227,0.2); }
.novel-item.active .muted { color: rgba(255,255,255,0.8); }
.muted { color: var(--muted); font-size: 13px; }

/* Image Upload UI */
.img-upload-box { width: 120px; height: 120px; border: 2px dashed var(--border); border-radius: var(--radius); display: flex; align-items: center; justify-content: center; cursor: pointer; overflow: hidden; background: var(--bg); position: relative; flex-shrink: 0; }
.img-upload-box img { width: 100%; height: 100%; object-fit: cover; }
.img-upload-box::after { content: '+ รูปภาพ'; position: absolute; font-size: 13px; color: var(--muted); font-weight: 600; opacity: 1; transition: opacity 0.2s; }
.img-upload-box.has-img::after { opacity: 0; }
.img-upload-box:hover::after { opacity: 1; background: rgba(255,255,255,0.7); padding: 4px 8px; border-radius: 4px; color: var(--text); }
.img-upload-wide { width: 100%; min-height: 100px; border: 2px dashed var(--border); border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer; overflow: hidden; background: var(--bg); position: relative; margin-top: 8px; transition: border-color 0.2s; }
.img-upload-wide:hover { border-color: var(--accent); }
.img-upload-wide img { width: 100%; max-height: 300px; object-fit: contain; background: #000; }
.img-upload-wide .placeholder { display: flex; flex-direction: column; align-items: center; gap: 8px; color: var(--muted); }
.img-upload-wide .placeholder svg { width: 32px; height: 32px; fill: currentColor; }
.img-upload-wide.has-img .placeholder { display: none; }

/* Modal Overlay */
.modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; display: none; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.3s; }
.modal-overlay.show { display: flex; opacity: 1; }
.modal-content { max-width: 90%; max-height: 90%; position: relative; }
.modal-content img { max-width: 100%; max-height: 90vh; object-fit: contain; border-radius: 4px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
.modal-close { position: absolute; top: -40px; right: 0; background: none; border: none; color: #fff; font-size: 30px; cursor: pointer; padding: 0; }

/* Notion-style To-Do Table */
.notion-table { width: 100%; border-collapse: collapse; }
.notion-table th { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--border); color: var(--muted); font-weight: normal; font-size: 13px; }
.notion-table td { padding: 4px 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
.notion-table input[type="text"], .notion-table select { background: transparent; border: 1px solid transparent; width: 100%; padding: 6px; font-size: 14px; border-radius: 4px; }
.notion-table input[type="text"]:focus, .notion-table select:focus { border-color: var(--border); background: var(--bg); }
.status-badge { display: inline-block; padding: 4px 10px; border-radius: 12px; font-size: 12px; background: var(--border); font-weight: 600; color: var(--text); margin-top: 4px; }
.status-badge.doing { background: #ffeaa7; color: #d35400; }
.status-badge.done { background: #55efc4; color: #00b894; }

/* Specific Sections */
.plot-board { border-left: 3px solid var(--accent); padding-left: 16px; margin-bottom: 16px; position: relative; }
.plot-board::before { content: ''; position: absolute; left: -8px; top: 12px; width: 13px; height: 13px; background: var(--accent); border-radius: 50%; }
.rel-item { display: flex; align-items: center; gap: 10px; background: var(--bg); padding: 10px; border-radius: 8px; border: 1px solid var(--border); }
.rel-arrow { color: var(--accent); font-weight: bold; }
.empty-state { text-align: center; padding: 60px 20px; color: var(--muted); }
.stats { display: flex; gap: 24px; margin: 12px 0 24px; flex-wrap: wrap; background: var(--panel); padding: 16px 24px; border-radius: var(--radius); border: 1px solid var(--border); box-shadow: var(--shadow); align-items: center; }
.stats div { font-size: 13px; color: var(--muted); }
.stats b { color: var(--text); font-size: 18px; display: block; font-weight: 700; }
label { font-size: 13px; font-weight: 600; color: var(--muted); display: block; margin-bottom: 6px; }
.field { margin-bottom: 16px; }
.export-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px; }
#syncStatus { font-size: 12px; padding: 4px 8px; border-radius: 12px; background: #e0e0e0; display: inline-flex; align-items: center; gap: 6px; }
#syncStatus.online { background: #e6f4ea; color: #1e8e3e; }
#syncStatus.offline { background: #fce8e6; color: #d93025; }

/* Storyboard Grid */
.storyboard-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
.sb-card { border-top: 4px solid var(--border); }
.sb-card.st-ร่างเนม { border-top-color: #f39c12; }
.sb-card.st-ร่างภาพ { border-top-color: #3498db; }
.sb-card.st-ตัดเส้น { border-top-color: #9b59b6; }
.sb-card.st-ถมดำลงสี { border-top-color: #e84393; }
.sb-card.st-เสร็จสมบูรณ์ { border-top-color: #00b894; }
</style>
</head>
<body>

<!-- Modal สำหรับขยายรูปภาพ -->
<div id="imageModal" class="modal-overlay" onclick="closeModal()">
  <div class="modal-content" onclick="event.stopPropagation()">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <img id="modalImg" src="">
  </div>
</div>

<div class="app">
  <div class="sidebar" id="sidebar"></div>
  <div class="main">
    <div class="container" id="main"></div>
  </div>
</div>

<script>
// =========================================================
// Firebase Config
// =========================================================
const firebaseConfig = {
  apiKey: "AIzaSyCeWidKTLQNNnu3Cw3w_SOpJIGDfJk-R5o",
  authDomain: "novel-app-236eb.firebaseapp.com",
  projectId: "novel-app-236eb",
  storageBucket: "novel-app-236eb.firebasestorage.app",
  messagingSenderId: "143947599812",
  appId: "1:143947599812:web:e967176e0ceba96e63de91"
};
// =========================================================

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// เปิดใช้งาน Offline Persistence
db.enablePersistence().catch(err => {
    console.warn("ไม่สามารถเปิดโหมดออฟไลน์ได้: ", err.code);
});

const DOC_ID = 'my-workspace-master';
let docRef = db.collection('workspaces').doc(DOC_ID);

const STORE_KEY = 'novelProMasterV2'; 
let state = null;
let ui = { selectedNovelId: null, tab: 'info', editingChapterId: null, filterCat: '', chapterSearch: '' };
const STATUS_LABEL = { writing: 'กำลังเขียน/วาด', done: 'จบแล้ว', paused: 'พักไว้' };

// --- ระบบป้องกันหน้าจอเด้ง (Scroll Preservation System) ---
const scrollState = { main: { depth: 0, top: 0 }, sidebar: { depth: 0, top: 0 } };
function preserveScroll(selector, key, fn) {
  const el = document.querySelector(selector);
  if (scrollState[key].depth === 0 && el) scrollState[key].top = el.scrollTop;
  scrollState[key].depth++;
  fn();
  scrollState[key].depth--;
  if (scrollState[key].depth === 0 && el) requestAnimationFrame(() => el.scrollTop = scrollState[key].top);
}

function openModal(imgSrc) {
  if (!imgSrc) return;
  const modal = document.getElementById('imageModal');
  document.getElementById('modalImg').src = imgSrc;
  modal.classList.add('show');
}
function closeModal() { document.getElementById('imageModal').classList.remove('show'); }

function normalize(data) {
  if (!data || typeof data !== 'object') data = {};
  if (!Array.isArray(data.categoryList)) data.categoryList = ['แฟนตาซี','โรแมนซ์','สยองขวัญ','ดราม่า','ผจญภัย','สืบสวน','ไซไฟ','ตลก','สไลซ์ออฟไลฟ์'];
  if (!Array.isArray(data.novels)) data.novels = [];

  data.novels.forEach(n => {
    n.id = n.id || uid();
    n.title = n.title || 'โปรเจกต์ใหม่';
    n.synopsis = n.synopsis || '';
    n.coverImage = n.coverImage || '';
    n.status = n.status || 'writing';
    n.targetDeadline = n.targetDeadline || ''; 
    n.createdAt = n.createdAt || new Date().toISOString();
    n.categories = Array.isArray(n.categories) ? n.categories : [];
    n.tags = Array.isArray(n.tags) ? n.tags : [];
    n.chapters = Array.isArray(n.chapters) ? n.chapters : [];
    n.characters = Array.isArray(n.characters) ? n.characters : [];
    n.world = Array.isArray(n.world) ? n.world : [];
    n.plot = Array.isArray(n.plot) ? n.plot : [];
    n.glossary = Array.isArray(n.glossary) ? n.glossary : [];
    n.relationships = Array.isArray(n.relationships) ? n.relationships : [];
    n.ideas = Array.isArray(n.ideas) ? n.ideas : [];
    n.todos = Array.isArray(n.todos) ? n.todos : [];
    n.storyboards = Array.isArray(n.storyboards) ? n.storyboards : [];
    n.wordCountHistory = n.wordCountHistory || {};

    n.todos.forEach(t => {
      t.id = t.id || uid();
      t.name = t.name || '';
      t.status = t.status || 'ยังไม่ได้เริ่ม';
      t.done = t.done ? true : false;
      t.dueDate = t.dueDate || '';
      t.message = t.message || '';
    });

    n.storyboards.forEach(sb => {
      sb.id = sb.id || uid();
      sb.order = typeof sb.order === 'number' ? sb.order : 1;
      sb.image = sb.image || '';
      sb.action = sb.action || '';
      sb.dialogue = sb.dialogue || '';
      sb.status = sb.status || 'ร่างเนม';
    });

    n.chapters.forEach(ch => {
      ch.id = ch.id || uid();
      ch.order = typeof ch.order === 'number' ? ch.order : 1;
      ch.title = ch.title || '';
      ch.content = ch.content || '';
      ch.isDraft = ch.isDraft !== undefined ? ch.isDraft : true;
      ch.updatedAt = ch.updatedAt || new Date().toISOString();
    });

    n.characters.forEach(c => {
      c.id = c.id || uid();
      c.name = c.name || ''; c.role = c.role || ''; c.firstApp = c.firstApp || ''; c.image = c.image || '';
      c.physical = c.physical || ''; c.background = c.background || ''; c.personality = c.personality || '';
      c.traits = c.traits || ''; c.otherInfo = c.otherInfo || ''; 
    });

    n.glossary.forEach(g => {
      g.id = g.id || uid(); g.word = g.word || ''; g.meaning = g.meaning || ''; g.note = g.note || ''; g.tag = g.tag || ''; 
    });

    n.ideas.forEach(idea => {
      idea.id = idea.id || uid(); idea.title = idea.title || ''; idea.detail = idea.detail || ''; idea.image = idea.image || '';
    });
  });
  return data;
}

// สร้างข้อมูลจำลองสำหรับผู้เริ่มใหม่
function getFallbackData() {
  return {
    novels: [{
      id: uid(), title: 'โปรเจกต์มังงะ/นิยายเรื่องใหม่', synopsis: '', coverImage: '', targetDeadline: '',
      chapters: [{ id: uid(), order: 1, title: 'บทนำ', content: 'พิมพ์เนื้อหาตอนที่ 1 ที่นี่...', isDraft: true, updatedAt: new Date().toISOString() }],
      storyboards: [{ id: uid(), order: 1, image: '', action: 'มุมกด มองเห็นตัวละครยืนอยู่กลางสายฝน', dialogue: 'ในที่สุด... ก็มาถึงจนได้สินะ', status: 'ร่างเนม' }],
      characters: [{ id: uid(), name: 'ตัวละครตัวอย่าง', role: 'ตัวเอก', firstApp: 'บทนำ', image: '', physical: '', background: '', personality: 'แค่ต้องการพลังงานความเคลื่อนไหวของคนอื่นเพื่อไม่ให้ห้องมันเงียบและน่าเบื่อจนเกินไป', traits: '', otherInfo: '' }],
      relationships: [], world: [], tags: [], categories: [],
      plot: [{ id: uid(), title: 'Act 1: จุดเริ่มต้น (Setup)', detail: 'แนะนำโลกและตัวเอก...' }],
      glossary: [{ id: uid(), word: 'เซนติเนล (Sentinel)', meaning: 'ผู้ที่มีสัมผัสทั้ง 5 เฉียบคมกว่าคนปกติ', note: 'มักจะเกิดอาการโอเวอร์โหลดได้ง่าย', tag: 'ระบบพลัง' }],
      ideas: [{ id: uid(), title: 'ไอเดียฉากจบ', detail: 'อาจจะให้ตัวเอกเสียสละพลังทั้งหมดเพื่อช่วยนางเอก...', image: '' }],
      todos: [{ id: uid(), name: 'วางพล็อตเรื่อง', status: 'ยังไม่ได้เริ่ม', done: false, dueDate: '', message: 'จัดโครงสร้าง Act 1-3' }],
      wordCountHistory: {}
    }]
  };
}

function save() { 
  if(!state) return;
  docRef.set(state, {merge: true}).catch(err => console.error("Error saving: ", err));
}

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,5); }
function esc(s) { return (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function countText(t) {
  let str = t || ''; const chars = str.replace(/\s/g,'').length; const wordsBySpace = str.trim() ? str.trim().split(/\s+/).length : 0;
  return { chars, wordsBySpace };
}
function getNovel(id) { return state.novels.find(n => n.id === (id || ui.selectedNovelId)); }

function updateDailyWordCount() {
  const n = getNovel(); if(!n) return;
  const today = new Date().toISOString().slice(0,10);
  const totalWords = n.chapters.reduce((s,c) => s + countText(c.content).wordsBySpace, 0);
  n.wordCountHistory[today] = totalWords;
  save();
}

function handleImageUpload(callback) {
  const input = document.createElement('input'); input.type = 'file'; input.accept = 'image/*';
  input.onchange = e => {
    const file = e.target.files[0]; if (!file) return;
    const reader = new FileReader(); reader.onload = event => callback(event.target.result); reader.readAsDataURL(file);
  };
  input.click();
}

function triggerUploadOrView(imgSrc, callback) { if (imgSrc) openModal(imgSrc); else handleImageUpload(callback); }

// --- File Export / Import ---
function downloadFile(content, fileName, mimeType) {
  const blob = new Blob([content], { type: mimeType });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = fileName;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
}
function exportJSON() { downloadFile(JSON.stringify(state, null, 2), "novel_backup_" + new Date().toISOString().slice(0,10) + ".json", "application/json"); }
function importJSON(event) {
  const fileReader = new FileReader();
  if (event.target.files[0]) {
    fileReader.readAsText(event.target.files[0], "UTF-8");
    fileReader.onload = e => {
      try { state = normalize(JSON.parse(e.target.result)); save(); renderSidebar(); renderMain(); alert('นำเข้าข้อมูลขึ้น Cloud สำเร็จ!'); } 
      catch(err) { alert('ไฟล์ข้อมูลไม่ถูกต้อง!'); }
    };
  }
}

function exportTXT() {
  const n = getNovel(); let text = `${n.title}\n\n`; n.chapters.forEach(c => text += `--- ${c.title} ---\n${c.content}\n\n`);
  downloadFile(text, `${n.title}.txt`, 'text/plain');
}
function exportMD() {
  const n = getNovel(); let text = `# ${n.title}\n\n`; n.chapters.forEach(c => text += `## ${c.title}\n\n${c.content}\n\n`);
  downloadFile(text, `${n.title}.md`, 'text/markdown');
}
function exportDOC() {
  const n = getNovel();
  let html = `<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'><head><meta charset='utf-8'><title>${n.title}</title></head><body><h1>${n.title}</h1>`;
  n.chapters.forEach(c => { html += `<h2>${c.title}</h2><p>${esc(c.content).replace(/\n/g, '<br>')}</p>`; });
  html += `</body></html>`;
  downloadFile(html, `${n.title}.doc`, 'application/msword');
}
function exportPDF() {
  const n = getNovel(); const iframe = document.createElement('iframe'); iframe.style.display = 'none'; document.body.appendChild(iframe);
  const doc = iframe.contentWindow.document; doc.open();
  doc.write(`<html><head><title>${n.title}</title><style>body{font-family:sans-serif; line-height:1.6; white-space:pre-wrap; padding:20px;} h1{text-align:center;} h2{page-break-before:always; margin-top:2em;}</style></head><body><h1>${n.title}</h1>`);
  n.chapters.forEach(c => doc.write(`<h2>${c.title}</h2><div>${esc(c.content)}</div>`));
  doc.write('</body></html>'); doc.close(); iframe.contentWindow.focus(); iframe.contentWindow.print();
  setTimeout(() => iframe.remove(), 2000);
}

// --- Actions ---
function addNovel() {
  const title = prompt('ชื่อโปรเจกต์ใหม่:'); if (!title) return;
  const n = normalize({ novels: [{ title: title }] }).novels[0];
  state.novels.unshift(n); ui.selectedNovelId = n.id; ui.tab = 'info'; ui.editingChapterId = null; 
  save(); renderSidebar(); renderMain();
}
function deleteNovel(id) {
  if(!confirm('ลบเรื่องนี้ทั้งหมด? (ข้อมูลบนคลาวด์จะหายไปด้วย)')) return;
  state.novels = state.novels.filter(n => n.id !== id);
  if(ui.selectedNovelId === id) ui.selectedNovelId = null;
  save(); renderSidebar(); renderMain();
}
function selectNovel(id) { ui.selectedNovelId = id; ui.tab = 'info'; ui.editingChapterId = null; renderSidebar(); renderMain(); }
function setTab(t) { ui.tab = t; ui.editingChapterId = null; renderTabsContentOnly(); }

// --- Render Core with Scroll Preserve ---

      `).join('') : '<div class="empty-state" style="padding:20px;">ยังไม่มีเรื่อง</div>';

      <div id="syncStatus" class="online" style="margin-bottom:12px; align-self:flex-start;">

          <button class="small ghost" onclick="exportJSON()" style="flex:1;" title="ดาวน์โหลด JSON">⬇️ Export</button>
          <button class="small ghost" onclick="document.getElementById('importFile').click()" style="flex:1;" title="อัปโหลด JSON">⬆️ Import</button>
          <input type="file" id="importFile" style="display:none" accept=".json" onchange="importJSON(event)">

  });
}

function renderProgressAndTodo(n) {
  const total = n.chapters.length;
  const finalCount = n.chapters.filter(c => !c.isDraft).length;
  const draftCount = total - finalCount;
  const pct = total === 0 ? 0 : Math.round((finalCount / total) * 100);
  
  const todoRows = n.todos.map((t, i) => {
    let statusClass = '';
    if(t.status === 'กำลังทำ') statusClass = 'doing';
    if(t.status === 'เสร็จแล้ว' || t.done) statusClass = 'done';

    // โลจิกคำนวณ Deadline นับถอยหลังในแต่ละ To-do
    let todoDeadlineText = 'เลือกวันที่';
    let todoDeadlineColor = 'var(--muted)';
    if (t.dueDate) {
      const today = new Date(); today.setHours(0,0,0,0);
      const target = new Date(t.dueDate); target.setHours(0,0,0,0);
      const diffDays = Math.ceil((target - today) / (1000 * 60 * 60 * 24));
      
      if (t.done || t.status === 'เสร็จแล้ว') {
         todoDeadlineText = 'เสร็จเรียบร้อย';
         todoDeadlineColor = 'var(--done)';
      } else if (diffDays > 0) {
         todoDeadlineText = diffDays + ' วัน';
         todoDeadlineColor = 'var(--accent)';
      } else if (diffDays === 0) {
         todoDeadlineText = 'วันนี้!';
         todoDeadlineColor = 'var(--draft)';
      } else {
         todoDeadlineText = 'เลยมา ' + Math.abs(diffDays) + ' วัน';
         todoDeadlineColor = 'var(--danger)';
      }
    }

    return `
    <tr>
      <td><div style="display:flex; align-items:center; gap:8px; margin-top:8px;">📝 <input value="${esc(t.name)}" placeholder="ชื่อ..." onblur="getNovel().todos[${i}].name=this.value; save();"></div></td>
      <td>
        <select onchange="getNovel().todos[${i}].status=this.value; save(); renderMain();" class="status-badge ${statusClass}">
          <option value="ยังไม่ได้เริ่ม" ${t.status==='ยังไม่ได้เริ่ม'?'selected':''}>ยังไม่ได้เริ่ม</option>
          <option value="กำลังทำ" ${t.status==='กำลังทำ'?'selected':''}>กำลังทำ</option>
          <option value="เสร็จแล้ว" ${t.status==='เสร็จแล้ว'?'selected':''}>เสร็จแล้ว</option>
        </select>
      </td>
      <td style="text-align:center; padding-top:14px;"><input type="checkbox" style="width:auto;" ${t.done ? 'checked' : ''} onchange="getNovel().todos[${i}].done=this.checked; if(this.checked) getNovel().todos[${i}].status='เสร็จแล้ว'; save(); renderMain();"></td>
      <td>
        <div style="display:flex; flex-direction:column; gap:2px; padding-top:8px; line-height:1;">
          <b style="color:${todoDeadlineColor}; font-size:13px;">${todoDeadlineText}</b>
          <input type="date" value="${esc(t.dueDate)}" onchange="getNovel().todos[${i}].dueDate=this.value; save(); renderMain();" style="padding:0; font-size:11px; border:none; background:transparent; color:var(--muted); cursor:pointer;">
        </div>
      </td>
      <td><div style="margin-top:8px;"><input value="${esc(t.message)}" placeholder="ข้อความรายละเอียด..." onblur="getNovel().todos[${i}].message=this.value; save();"></div></td>
      <td style="padding-top:14px;"><button class="btn-close" onclick="getNovel().todos.splice(${i},1); save(); renderMain();" title="ลบรายการ">✕</button></td>
    </tr>
  `}).join('');

  return `
    <div class="card" style="margin-bottom:24px;">
      <div class="row" style="justify-content:space-between; margin-bottom:10px;">
        <div style="font-weight:600; font-size:16px;">ความคืบหน้าการเขียนนิยาย</div>
        <div class="muted">${finalCount}/${total} ตอนพร้อมเผยแพร่ (${pct}%)</div>
      </div>
      <div style="height:12px; background:var(--draft); border-radius:6px; overflow:hidden;">
        <div style="width:${pct}%; height:100%; background:var(--done); transition:width .3s;"></div>
      </div>
      <div class="row" style="margin-top:10px; gap:20px;">
        <div class="muted"><span style="color:var(--done); font-weight:900;">●</span> พร้อมเผยแพร่ ${finalCount} ตอน</div>
        <div class="muted"><span style="color:var(--draft); font-weight:900;">●</span> ฉบับร่าง ${draftCount} ตอน</div>
      </div>
      <hr style="border:0; border-top:1px solid var(--border); margin:24px 0;">
      <div style="font-weight:700; font-size:18px; margin-bottom:12px; display:flex; align-items:center; gap:8px;">📋 To-do list</div>
      <div style="overflow-x:auto;">
        <table class="notion-table">
          <thead>
            <tr><th style="width:25%;">Aa ชื่อ</th><th style="width:15%;">⚙️ สถานะ</th><th style="width:5%; text-align:center;">☑</th><th style="width:15%;">⏱️ นับถอยหลัง</th><th style="width:35%;">≡ ข้อความ</th><th style="width:5%;"></th></tr>
          </thead>
          <tbody>${todoRows}</tbody>
        </table>
      </div>
      <button class="ghost small" style="margin-top:12px;" onclick="getNovel().todos.push({id:uid(), name:'', status:'ยังไม่ได้เริ่ม', done:false, dueDate:'', message:''}); save(); renderMain();">+ New page</button>
    </div>`;
}

function renderMain() {
  preserveScroll('.main', 'main', () => {
    if(!state) return;
    const el = document.getElementById('main');
    const n = getNovel();
    if (!n) { el.innerHTML = '<div class="empty-state"><h3>ยังไม่ได้เลือกโปรเจกต์</h3><p>เลือกจากเมนูด้านซ้าย หรือสร้างเรื่องใหม่เพื่อเริ่มต้น</p></div>'; return; }

    const totalChars = n.chapters.reduce((s,c) => s + countText(c.content).chars, 0);
    const totalWords = n.chapters.reduce((s,c) => s + countText(c.content).wordsBySpace, 0);
    const avgWords = n.chapters.length > 0 ? Math.round(totalWords / n.chapters.length) : 0;
    
    let deadlineText = 'ตั้งเป้าหมาย (วันที่)';
    let deadlineColor = 'var(--text)';
    if (n.targetDeadline) {
      const today = new Date(); today.setHours(0,0,0,0);
      const target = new Date(n.targetDeadline); target.setHours(0,0,0,0);
      const diffDays = Math.ceil((target - today) / (1000 * 60 * 60 * 24));
      if (diffDays > 0) { deadlineText = diffDays + ' วัน'; deadlineColor = 'var(--accent)'; }
      else if (diffDays === 0) { deadlineText = 'วันนี้!'; deadlineColor = 'var(--draft)'; }
      else { deadlineText = 'เลยมา ' + Math.abs(diffDays) + ' วัน'; deadlineColor = 'var(--danger)'; }
    }

    el.innerHTML = `
      <div class="row" style="margin-bottom:24px; align-items:flex-end;">
        <div style="display:flex; flex-direction:column; gap:8px; align-items:center;">
          <div class="img-upload-box ${n.coverImage ? 'has-img' : ''}" onclick="triggerUploadOrView('${n.coverImage}', img => { getNovel().coverImage = img; save(); renderMain(); })">
            ${n.coverImage ? `<img src="${n.coverImage}">` : ''}
          </div>
          ${n.coverImage ? `<button class="ghost small" onclick="handleImageUpload(img => { getNovel().coverImage = img; save(); renderMain(); })">เปลี่ยนรูป</button>` : ''}
        </div>

        <div style="flex:1">
          <div class="row" style="margin-bottom:8px"><span class="badge ${n.status}">${STATUS_LABEL[n.status] || n.status}</span></div>
          <input value="${esc(n.title)}" onblur="getNovel().title = this.value; save(); renderSidebar();" style="font-size:28px; font-weight:700; border:none; background:transparent; padding:0; margin-bottom:8px; border-bottom:2px dashed var(--border); border-radius:0;">
          <div class="muted">คลิกที่รูปเพื่อขยาย / กดปุ่มเพื่อเปลี่ยนปก</div>
        </div>
        <button class="danger small ghost" onclick="deleteNovel('${n.id}')">ลบเรื่อง</button>
      </div>

      <!-- สถิติแบบจัดเต็ม (Stats) -->
      <div class="stats">
        <!-- ฝั่งซ้าย: สถิติพื้นฐาน -->
        <div><b>${n.chapters.length}</b>ตอนนิยาย</div>
        <div><b>${n.storyboards.length}</b>หน้าการ์ตูน</div>
        <div><b>${totalWords.toLocaleString()}</b>คำ (นับคร่าวๆ)</div>
        
        <div style="height: 30px; border-left: 1px solid var(--border); margin: 0 4px;"></div>
        
        <!-- ตรงกลาง: สถิติภาพรวม -->
        <div><b>${avgWords.toLocaleString()}</b>เฉลี่ยคำ/ตอน</div>
        <div><b>${n.characters.length}</b>ตัวละคร</div>
        <div><b>${n.glossary.length}</b>คลังศัพท์</div>
        <div><b>${n.ideas.length}</b>ไอเดีย</div>
        
        <div style="height: 30px; border-left: 1px solid var(--border); margin: 0 4px;"></div>
        
        <!-- ฝั่งขวา: นับถอยหลังกำหนดส่ง -->
        <div>
          <b style="color:${deadlineColor};">${deadlineText}</b>
          <div style="display:flex; align-items:center; font-size:11px; color:var(--muted); gap:4px;">
            กำหนดส่ง <input type="date" value="${n.targetDeadline}" onchange="getNovel().targetDeadline=this.value; save(); renderMain();" style="border:none; background:transparent; padding:0; font-family:inherit; color:var(--muted); cursor:pointer; width:auto; font-size:11px; margin-top:-2px;">
          </div>
        </div>
      </div>

      ${renderProgressAndTodo(n)}

      <div class="tabs" id="mainTabs">
        ${[{id:'info', name:'ข้อมูล & แท็ก'},{id:'plot', name:'โครงเรื่อง'},{id:'storyboard', name:'🖼️ สตอรี่บอร์ด'},{id:'chapters', name:'นิยาย/บทบรรยาย'},{id:'world', name:'โลก/เซตติ้ง'},{id:'characters', name:'ตัวละคร'},{id:'timeline', name:'📈 ไทม์ไลน์'},{id:'glossary', name:'คลังศัพท์'},{id:'ideas', name:'💡 ไอเดีย'}].map(t => `<div class="tab ${ui.tab === t.id ? 'active' : ''}" onclick="setTab('${t.id}')">${t.name}</div>`).join('')}
      </div>
      <div id="tabContent"></div>
    `;
    renderTabsContentOnly();
  });
}

function renderTabsContentOnly() {
  preserveScroll('.main', 'main', () => {
    const n = getNovel(); if(!n) return;
    const tabs = document.getElementById('mainTabs');
    if(tabs) {
        Array.from(tabs.children).forEach(t => t.classList.remove('active'));
        const activeMap = {info:'ข้อมูล', plot:'โครง', storyboard:'สตอรี่บอร์ด', chapters:'นิยาย', world:'โลก', characters:'ตัวละคร', timeline:'ไทม์ไลน์', glossary:'ศัพท์', ideas:'ไอเดีย'};
        const activeTab = Array.from(tabs.children).find(t => t.innerText.includes(activeMap[ui.tab]));
        if(activeTab) activeTab.classList.add('active');
    }
    const content = document.getElementById('tabContent');
    if (ui.tab === 'info') renderInfo(content, n);
    if (ui.tab === 'storyboard') renderStoryboard(content, n);
    if (ui.tab === 'chapters') renderChapters(content, n);
    if (ui.tab === 'timeline') renderTimeline(content, n);
    if (ui.tab === 'plot') renderPlot(content, n);
    if (ui.tab === 'characters') renderCharacters(content, n);
    if (ui.tab === 'world') renderWorld(content, n);
    if (ui.tab === 'glossary') renderGlossary(content, n);
    if (ui.tab === 'ideas') renderIdeas(content, n);
  });
}

// ---------------- แท็บข้อมูลต่างๆ ---------------- //
function handleAddTag() { const input = document.getElementById('tagInput'); const t = input.value.trim(); if(t && !getNovel().tags.includes(t)){ getNovel().tags.push(t); save(); renderTabsContentOnly(); setTimeout(() => document.getElementById('tagInput').focus(), 0); } }
function renderInfo(el, n) {
  const catHtml = state.categoryList.map(c => {
    const isActive = n.categories.includes(c);
    return `<span class="chip" style="background:${isActive ? 'var(--accent)' : 'var(--border)'}; color:${isActive ? '#fff' : 'inherit'}; cursor:pointer;" onclick="const target=getNovel('${n.id}'); const idx=target.categories.indexOf('${esc(c)}'); if(idx>-1) target.categories.splice(idx,1); else target.categories.push('${esc(c)}'); save(); renderTabsContentOnly();">${esc(c)}<span onclick="event.stopPropagation(); if(confirm('ลบหมวดหมู่ \\'${esc(c)}\\' ออกจากระบบ?')) { state.categoryList = state.categoryList.filter(x=>x!=='${esc(c)}'); state.novels.forEach(nv => nv.categories = nv.categories.filter(x=>x!=='${esc(c)}')); save(); renderTabsContentOnly(); }" style="margin-left:6px; font-weight:bold; cursor:pointer; opacity:0.6;">✕</span></span>`;
  }).join('');
  const tagHtml = n.tags.length > 0 ? n.tags.map(t => `<span class="chip" style="background:var(--panel); border:1px solid var(--border);">${esc(t)} <button onclick="getNovel('${n.id}').tags = getNovel('${n.id}').tags.filter(x=>x!=='${esc(t)}'); save(); renderTabsContentOnly();">✕</button></span>`).join('') : '<span class="muted">ยังไม่มีแท็ก</span>';
  el.innerHTML = `<div class="card"><div class="field"><label>เรื่องย่อ (Synopsis)</label><textarea rows="5" onblur="getNovel().synopsis = this.value; save();">${esc(n.synopsis)}</textarea></div><div class="field"><label>สถานะ</label><select onchange="getNovel().status = this.value; save(); renderMain();" style="max-width: 200px;">${Object.entries(STATUS_LABEL).map(([k, v]) => `<option value="${k}" ${n.status === k ? 'selected' : ''}>${v}</option>`).join('')}</select></div><div class="field" style="margin-top: 24px;"><label>หมวดหมู่</label><div class="row">${catHtml}<button class="ghost small" onclick="const c = prompt('เพิ่มหมวดหมู่ใหม่:'); if(c && !state.categoryList.includes(c)) { state.categoryList.push(c); save(); renderTabsContentOnly(); }">+ เพิ่มหมวด</button></div></div><div class="field" style="margin-top: 24px;"><label>แท็กโปรเจกต์</label><div class="row" style="margin-bottom:10px" id="tagListContainer">${tagHtml}</div><div class="row nowrap" style="max-width: 400px;"><input id="tagInput" placeholder="พิมพ์แท็กแล้วกด เพิ่ม (หรือ Enter)" style="flex:1;" onkeydown="if(event.key==='Enter') handleAddTag()"><button class="small" onclick="handleAddTag()">เพิ่ม</button></div></div></div>`;
}

// ---------------- STORYBOARD ---------------- //
function addStoryboard() {
  const n = getNovel();
  const nextOrder = n.storyboards.length > 0 ? Math.max(...n.storyboards.map(s => s.order)) + 1 : 1;
  n.storyboards.push({ id:uid(), order:nextOrder, image:'', action:'', dialogue:'', status:'ร่างเนม' });
  save(); renderTabsContentOnly(); renderSidebar();
}

function exportStoryboardScript() {
  const n = getNovel();
  const sorted = [...n.storyboards].sort((a,b) => a.order - b.order);
  let text = `สคริปต์บทสนทนา: ${n.title}\n\n`;
  sorted.forEach(sb => {
    if(sb.dialogue.trim() !== '') {
      text += `--- หน้า ${sb.order} ---\n${sb.dialogue}\n\n`;
    }
  });
  downloadFile(text, `${n.title}_script.txt`, 'text/plain');
}

function renderStoryboard(el, n) {
  const statuses = ['ร่างเนม', 'ร่างภาพ', 'ตัดเส้น', 'ถมดำลงสี', 'เสร็จสมบูรณ์'];

  const sbHtml = sorted.map((sb, i) => `

           <button class="btn-close" title="เลื่อนลง" onclick="const n=getNovel(); if(${i}<n.storyboards.length-1){ const temp=n.storyboards[${i}].order; n.storyboards[${i}].order=n.storyboards[${i}+1].order; n.storyboards[${i}+1].order=temp; save(); renderTabsContentOnly(); }">⬇️</button>
           <button class="btn-close" style="color:var(--danger)" title="ลบหน้านี้" onclick="if(confirm('ลบหน้า ${sb.order}?')){ getNovel().storyboards = getNovel().storyboards.filter(x=>x.id!=='${sb.id}'); save(); renderTabsContentOnly(); renderSidebar(); }">✕</button>

      <select onchange="getNovel().storyboards.find(x=>x.id==='${sb.id}').status = this.value; save(); renderTabsContentOnly();" style="margin-bottom:12px; font-size:12px; padding:6px; background:var(--bg);">
         ${statuses.map(st => `<option value="${st}" ${sb.status===st?'selected':''}>สถานะ: ${st}</option>`).join('')}

         ${sb.image ? `<img src="${sb.image}">` : `<div class="placeholder"><svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V5h14v14zm-5-7l-3 3.72L9 13l-3 4h12l-4-5z"/></svg>ใส่สเกตช์/มุมกล้อง/เรฟ</div>`}
      </div>

function renderTimeline(el, n) {
  const historyKeys = Object.keys(n.wordCountHistory).sort((a,b) => new Date(b) - new Date(a));
  let timelineHtml = '<div class="empty-state">ยังไม่มีข้อมูลการเขียน เริ่มเขียนนิยายเพื่อบันทึกสถิติ!</div>';
  if (historyKeys.length > 0) {
    let prevTotal = 0;
    const records = Object.keys(n.wordCountHistory).sort((a,b) => new Date(a) - new Date(b)).map(date => {
      const currentTotal = n.wordCountHistory[date]; const writtenToday = currentTotal - prevTotal; prevTotal = currentTotal; return { date, writtenToday, total: currentTotal };
    }).reverse();
    timelineHtml = records.map(r => `<div class="row nowrap card" style="padding:12px 20px; margin-bottom:8px; border-left:4px solid ${r.writtenToday > 0 ? 'var(--done)' : 'var(--danger)'}"><div style="width:120px; font-weight:bold; color:var(--muted);">${new Date(r.date).toLocaleDateString('th-TH', {day:'numeric', month:'short', year:'numeric'})}</div><div style="flex:1;"><div style="font-size:18px; font-weight:700; color:${r.writtenToday > 0 ? 'var(--done)' : 'var(--danger)'};">${r.writtenToday > 0 ? '+' : ''}${r.writtenToday.toLocaleString()} คำ</div><div class="muted" style="font-size:12px;">ยอดรวมในวันนั้น: ${r.total.toLocaleString()} คำ</div></div><div>${r.writtenToday >= 1000 ? '🔥 ยอดเยี่ยม!' : r.writtenToday > 0 ? '✍️ สู้ต่อไป' : '💤 วันพักผ่อน'}</div></div>`).join('');
  }
  el.innerHTML = `<div class="row" style="margin-bottom:16px;"><h3>📈 ไทม์ไลน์การเขียน (Word Count History)</h3></div><div class="muted" style="margin-bottom:20px;">*ระบบจะบันทึกยอดรวมคำศัพท์อัตโนมัติเมื่อคุณพิมพ์เนื้อหาตอนเสร็จแล้วคลิกที่อื่น (Save)*</div>${timelineHtml}`;
}

function init() {
  document.getElementById('sidebar').innerHTML = '<div class="empty-state">กำลังเชื่อมต่อ Cloud...</div>';
  window.addEventListener('online',  updateNetworkStatus);
  window.addEventListener('offline', updateNetworkStatus);

  docRef.onSnapshot((doc) => {
    if (doc.exists) {
      state = normalize(doc.data());
    } else {
      let oldLocal = null;
      try { const raw = localStorage.getItem(STORE_KEY); if (raw) oldLocal = JSON.parse(raw); } catch(e) {}
      state = normalize(oldLocal || getFallbackData());
      save();
    }
    
    if(state.novels.length > 0 && !ui.selectedNovelId) { ui.selectedNovelId = state.novels[0].id; }
    
    renderSidebar(); 
    renderMain();
    updateNetworkStatus();
    
  }, (error) => {
    console.error("Sync Error:", error);
    document.getElementById('sidebar').innerHTML = `<div class="empty-state" style="color:red;">ไม่สามารถโหลดข้อมูลได้: ${error.message}</div>`;
  });
}

function updateNetworkStatus() {
  const badge = document.getElementById('syncStatus');
  if(!badge) return;
  if (navigator.onLine) {
    badge.className = 'online';
    badge.innerHTML = '<span style="font-size:10px;">🟢</span> เชื่อมต่อ Cloud แล้ว';
  } else {
    badge.className = 'offline';
    badge.innerHTML = '<span style="font-size:10px;">🔴</span> ออฟไลน์ (กำลังรอซิงค์)';
  }
}

init();
</script>
</body>
</html>
